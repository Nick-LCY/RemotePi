name = "remotepi-worker"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[observability]
enabled = true

# Durable Object Room — one Room per token (idFromName(token)).
# new_sqlite_classes = ["Room"] enables SQLite-backed DO storage without
# Hibernation (control.md §2 备注: DO 主动探活; M2 不开 Hibernation).
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]